name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run codex:check
      - name: Build and Package
        run: npm run codex:package
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hover-extension-dist
          path: dist/**

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, msedge]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build
        run: npm run build
      - name: Hover smoke test (server fallback)
        run: npm run test:e2e -- --channel=${{ matrix.browser }}
      - name: Hover smoke test (plantuml.js path)
        run: npm run test:e2e -- --channel=${{ matrix.browser }} --cheerpj=stub
      - name: CheerpJ probe (diagnostic)
        if: always()
        continue-on-error: true
        run: node scripts/cheerpj-probe.js --channel=${{ matrix.browser }}
      - name: Hover smoke test (real plantuml.js)
        run: npm run test:e2e -- --channel=${{ matrix.browser }} --cheerpj=real
